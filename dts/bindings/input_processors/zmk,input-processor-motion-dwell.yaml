description: Enable an automatic layer after sustained XY motion, with cancellable requests and an idle deadline
compatible: "zmk,input-processor-motion-dwell"
include: ip_two_param.yaml

properties:
  manual-layer:
    type: int
    required: true
    description: Independently held layer; do not create automatic ownership while held
  dwell-ms:
    type: int
    required: true
    description: Minimum duration spanned by a continuous run of nonzero XY samples
  min-distance:
    type: int
    required: true
    description: Positive minimum sum of absolute X/Y input counts in the same continuous run; required together with dwell-ms for entry only
  max-gap-ms:
    type: int
    required: true
    description: A larger gap between nonzero samples starts a new run
  require-prior-idle-ms:
    type: int
    required: true
    description: Minimum time after the last keycode press before automatic activation
  excluded-positions:
    type: array
    required: true
    description: Positions that preserve active automatic ownership when pressed
  activity-layers:
    type: array
    required: true
    description: Layer indices whose highest-active controls count as pointer activity
  activity-positions:
    type: array
    required: true
    description: Pointer control positions that renew and hold an already active automatic layer
