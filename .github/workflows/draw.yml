name: Draw keymap

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-22.04
    env:
      SOURCE_REVISION: ${{ github.sha }}
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE_REVISION }}

      - name: Draw keymap in the pinned environment
        run: ./scripts/zmk-env draw

      - name: Upload drawing and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: keymap-drawing
          if-no-files-found: error
          path: |
            keymap-drawer/roBa.svg
            keymap-drawer/roBa.yaml
            artifacts/keymap-provenance.json
            artifacts/keymap-west-manifest.lock.yml

      - name: Commit updated drawing
        run: |
          if git diff --quiet -- keymap-drawer/roBa.svg keymap-drawer/roBa.yaml; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add keymap-drawer/roBa.svg keymap-drawer/roBa.yaml
          git commit -m "[Draw] Update keymap drawing"
          git push origin "HEAD:${GITHUB_REF_NAME}"
